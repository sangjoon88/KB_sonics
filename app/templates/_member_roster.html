{% from "_macros.html" import bn, pos_badges, role_icon %}
<div class="p-4">
  <div class="flex items-center justify-between">
    <div class="font-bold">🏀 함께 뛰는 멤버 <span class="text-sm font-normal text-stone-500">{{ members|length }}명</span></div>
    <button type="button" onclick="document.getElementById('kb-dialog').close()" aria-label="닫기" class="text-stone-400 px-1">✕</button>
  </div>
  <ul class="mt-3 max-h-[65vh] overflow-y-auto divide-y divide-stone-100">
    {% for m in members %}
    <li class="flex items-center gap-2 py-2 text-sm {{ 'font-bold' if me and m.id == me.id }}">
      {{ bn(m) }}
      <span class="flex-1 truncate">{{ m.name }} {% if m.is_admin %}<span class="text-xs">{{ role_icon(m) }}</span>{% endif %}</span>
      <span class="shrink-0 whitespace-nowrap">{{ pos_badges(m) }}</span>
    </li>
    {% endfor %}
  </ul>
</div>
